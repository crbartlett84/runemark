name: Runemark Import
description: >-
  Imports the tags, details, studio, links, people and chapters (with ends) Runemark wrote into your videos,
  keeps Stash in step when a video changes in Runemark, and fills in studios from StashDB.
version: 0.4.1
url: https://github.com/crbartlett84/runemark/tree/main/integrations/stash
exec:
  - python
  - "{pluginDir}/runemark_import.py"
interface: raw
errLog: warning
tasks:
  - name: Import from Runemark
    description: Check every scene's file for Runemark's tags, details, people and chapters, and bring Stash up to date. Safe to run again.
    defaultArgs:
      mode: all
  - name: Import changed videos
    description: >-
      Re-import the videos whose file changed since their last import (after an edit in Runemark). Runemark's
      details replace Stash's when "Follow Runemark" is on. Runs after each scan.
    defaultArgs:
      mode: changed
  - name: Fill in studios from StashDB
    description: >-
      Look up each studio not yet checked on StashDB and fill in its logo, web address, parent network and StashDB
      id (blanks only). Needs StashDB under Settings > Metadata Providers.
    defaultArgs:
      mode: studios
hooks:
  - name: Import new scenes from Runemark
    description: When a scan adds a scene, import what Runemark wrote into its file.
    triggeredBy:
      - Scene.Create.Post
settings:
  overwrite:
    displayName: Replace details Stash already has
    description: "Off (default): only fill in what's blank. On: Runemark's title, details, date, rating, cover and performer fields win."
    type: BOOLEAN
  yearOnlyDates:
    displayName: Year-only dates become 1 January
    description: Runemark often knows only the year. Off (default) leaves Stash's date blank in that case.
    type: BOOLEAN
  importCover:
    displayName: Import Runemark's thumbnail as the cover
    description: Default on (only for scenes nobody has edited yet, unless "Replace details" is on).
    type: BOOLEAN
  followRunemark:
    displayName: Follow Runemark when a video changes
    description: >-
      On (default): when a video's file changed since its last import (an edit in Runemark), Runemark's title,
      details, date, rating, studio, tags, people and cover replace Stash's. Off: fill in blanks only.
    type: BOOLEAN
  studiosFromStashDB:
    displayName: Fill in new studios from StashDB
    description: >-
      On (default): a studio the plugin adds is looked up on StashDB (logo, web address, parent network). Needs
      StashDB under Settings > Metadata Providers.
    type: BOOLEAN
  createPerformers:
    displayName: Add performers Stash doesn't have yet
    description: Default on. Off only links people Stash already knows (by name or alias).
    type: BOOLEAN
